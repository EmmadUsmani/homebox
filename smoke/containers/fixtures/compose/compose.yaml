services:
  web:
    build: .
    command: ["node", "/app/server.cjs"]
    ports: ["${SMOKE_WEB_PORT:-8073}:8080"]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 15
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: smoke
    networks: [backend]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d smoke"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4-alpine
    networks: [backend]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
networks:
  backend:
volumes:
  postgres:
  redis:
